  "AC3221":
    # PureProtect 3200i. Property keys are unverified against real device
    # traffic (mapped from the equivalent CoAP "D03/D05" property scheme
    # shared with kongo09/philips-airpurifier-coap's AC32xx family, which
    # uses the identical D03xxx/D05xxx addressing for fan mode, PM2.5,
    # allergen index and filter properties as the already-confirmed
    # AC1715/AC0650 entries above). Model matching is by prefix, so any
    # reported ctn starting with "AC3221" (e.g. "AC3221/10") picks this up.
    # Please open an issue with debug logs if any entity reports an
    # incorrect value so this can be corrected.
    name: "Philips PureProtect 3200i (AC3221)"
    modes:
      Auto: 0
      Speed1: 1
      Speed2: 2
      Speed3: 3
      Speed4: 4
      Speed5: 5
      Sleep: 17
      Turbo: 18
      Medium: 19
    ports:
      status: "Status"
      control: "Control"
      config: "Config"
      filter_read: "filtRd"
      filter_write: "filtWr"
    properties:
      fan_speed: "D0310C"
      mode: "D0310C"
      power: "D0310D"
      filter_replace_nominal: "D05408"
      filter_replace_remaining: "D0540E"
      filter_clean_nominal: "D05207"
      filter_clean_remaining: "D0520D"
      filter_clean_reset_raw: "D0520D"
      filter_clean_reset_value: 720
      filter_replace_reset_raw: "D0540E"
      filter_replace_reset_value: 4800
      device_model: "ctn"
      device_brand: "D01S04"
      pm25: "D03221"
      allergen_index: "D03120"
      fan_level: "D0310D"
    sensors:
      - filter_replace_percentage
      - filter_replace_hours_remaining
      - filter_clean_percentage
      - filter_clean_hours_remaining
      - pm25
      - allergen_index
      - fan_level
    buttons:
      - reset_filter_clean
      - reset_filter_replace
