name: Air+ diagnostic tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tools
      - name: PowerShell diagnostic offline checks
        run: pwsh -NoProfile -File tools/airplus_windows_probe.ps1 -OfflineSelfTest
  home-assistant-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.10.1 paho-mqtt==2.1.0 pytest pytest-asyncio
      - run: python -m pytest -q ha_tests
      - run: python -m compileall -q custom_components
